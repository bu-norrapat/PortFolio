<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} | My Portfolio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topbar">
        <div class="brand">Norrapat</div>
        <nav class="nav-links">
            {% if lang == 'th' %}
            <a class="nav-link {% if request.path == url_for('home') %}active{% endif %}" href="{{ url_for('home') }}?lang=th">หน้าหลัก</a>
            <a class="nav-link {% if request.path == url_for('project') %}active{% endif %}" href="{{ url_for('project') }}?lang=th">โปรเจกต์</a>
            <a class="nav-link {% if request.path == url_for('activity') %}active{% endif %}" href="{{ url_for('activity') }}?lang=th">กิจกรรม</a>
            <a class="nav-link {% if request.path == url_for('certificates') %}active{% endif %}" href="{{ url_for('certificates') }}?lang=th">เกียรติบัตร</a>
            <a class="nav-link {% if request.path == url_for('about') %}active{% endif %}" href="{{ url_for('about') }}?lang=th">เกี่ยวกับผม</a>
            {% else %}
            <a class="nav-link {% if request.path == url_for('home') %}active{% endif %}" href="{{ url_for('home') }}?lang=en">Home</a>
            <a class="nav-link {% if request.path == url_for('project') %}active{% endif %}" href="{{ url_for('project') }}?lang=en">Project</a>
            <a class="nav-link {% if request.path == url_for('activity') %}active{% endif %}" href="{{ url_for('activity') }}?lang=en">Activity</a>
            <a class="nav-link {% if request.path == url_for('certificates') %}active{% endif %}" href="{{ url_for('certificates') }}?lang=en">Certificates</a>
            <a class="nav-link {% if request.path == url_for('about') %}active{% endif %}" href="{{ url_for('about') }}?lang=en">About Me</a>
            {% endif %}
            <div class="lang-switch">
                <a class="lang-option {% if lang == 'en' %}active{% endif %}" href="{{ request.path }}?lang=en">Eng</a>
                <a class="lang-option {% if lang == 'th' %}active{% endif %}" href="{{ request.path }}?lang=th">ไทย</a>
            </div>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
